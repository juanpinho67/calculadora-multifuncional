<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | Simple Math</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header class="header">
            <div class="logo">÷</div>
            <span class="tag">SIMPLE MATH</span>
            <h1>Calculadora</h1>
            <p>Seus cálculos de forma simples e prática.</p>
        </header>

        <section class="calculadora">

            <div class="campo">
                <label for="numero1">Primeiro número</label>
                <input type="number" id="numero1"
                    placeholder="Digite um número" step="any">
            </div>

            <div class="campo">
                <label for="operacao">Escolha a operação</label>
                <select id="operacao">
                    <option value="soma">Adição (+)</option>
                    <option value="subtracao">Subtração (-)</option>
                    <option value="multiplicacao">Multiplicação (×)</option>
                    <option value="divisao">Divisão (÷)</option>
                </select>
            </div>

            <div class="campo">
                <label for="numero2">Segundo número</label>
                <input type="number" id="numero2"
                    placeholder="Digite outro número" step="any">
            </div>

            <div class="botoes">
                <button class="limpar" onclick="limpar()">
                    Limpar
                </button>

                <button class="extra" onclick="porcentagem()">
                    %
                </button>

                <button class="extra" onclick="adicionarVirgula()">
                    ,
                </button>

                <button class="calcular" onclick="calcular()">
                    Realizar cálculo
                </button>
            </div>

            <div class="resultado">
                <span>SEU RESULTADO</span>
                <p id="resultado">0,00</p>
            </div>

        </section>

        <footer>
            <p>Simple Math • Calculadora Multifuncional</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
